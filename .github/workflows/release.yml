name: release

# Builds a signed release APK from main and publishes it as a rolling GitHub
# Release tagged `latest`. APKs are never committed: F-Droid builds from
# tagged source and doesn't accept binaries in a repo's history.
#
# Signing secrets (without them the APK is left unsigned and won't install):
#   RELEASE_KEYSTORE_B64      base64 of the .jks
#   RELEASE_KEYSTORE_PASSWORD store password
#   RELEASE_KEY_ALIAS         key alias
#   RELEASE_KEY_PASSWORD      key password (same as the store password for PKCS12)

on:
  push:
    branches: ["main"]
    paths: ["app/**", "gradle/**", "*.gradle.kts", "gradle.properties", ".github/workflows/release.yml"]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Same major version as F-Droid's build server, so its from-source
          # build can match this APK byte for byte.
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Configure release signing
        env:
          KS_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              # Absolute path: app/build.gradle.kts resolves storeFile against the
              # :app module dir, so a bare relative name would miss.
              echo "storeFile=$RUNNER_TEMP/release.jks"
              echo "storePassword=$KS_PASS"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASS"
            } > keystore.properties
            echo "Release signing configured."
          else
            echo "No RELEASE_KEYSTORE_B64 secret — APK will be unsigned."
          fi

      - name: Assemble release
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Stage APK
        id: stage
        run: |
          set -e
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          VNAME=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "vname=$VNAME" >> "$GITHUB_OUTPUT"
          mkdir -p release-artifacts
          # The asset name must stay exactly SysReadout-Monitor.apk: .fdroid.yml
          # Binaries and the README link point at it.
          cp "$APK" release-artifacts/SysReadout-Monitor.apk

      - name: Publish rolling 'latest' release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest release-artifacts/SysReadout-Monitor.apk \
            --prerelease \
            --title "Latest build (${{ steps.stage.outputs.vname }})" \
            --notes "Rolling build of \`main\`, replaced on every push. Stable versions are the vX.Y.Z releases. Install: https://github.com/${GITHUB_REPOSITORY}/releases/download/latest/SysReadout-Monitor.apk"
